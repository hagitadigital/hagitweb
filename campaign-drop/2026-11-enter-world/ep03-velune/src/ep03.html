  C(p2(4.69), p2(6.84), 'ההבטחה כתובה | *רק בסלוגן.', 'low'),
  C(p2(7.09), p2(9.69), 'כאן, הדלת | *חוזרת:', 'low'),

  ...(BZ ? [C(BIZ_T, BIZ_T + BZ * .30, 'כשהשפה של המותג שלך | *ברורה,', 'low'),
            C(BIZ_T + BZ * .30, BIZ_T + BZ * .76, 'את לא צריכה להסביר | בכל פעם מחדש מי את', 'low'),
            C(BIZ_T + BZ * .76, BIZ_T + BZ + .2, 'ולמה לבחור | *דווקא בך.', 'low')] : []),
  C(pq(0.0), pq(1.75), 'המותג שלך | כבר *קיים.', 'low'),
  C(pq(1.8), pq(QD), 'השאלה היא: | איפה רואים | את *ההבטחה שלך?', 'low'),

/* ─────────────────────────────────────────────────────────────────────────────────────────────── */
const ST = '../../studio/', VA = '../../../../velune/assets/';
const QUADS = {
 S1: [[[48,288],[428,320],[436,667],[51,667]], [[53,686],[437,684],[443,1018],[57,1037]], [[60,1057],[445,1040],[452,1475],[70,1515]]],
 S2: [[[48,293],[434,332],[436,712],[48,713]], [[52,732],[438,733],[443,1118],[54,1137]], [[54,1157],[446,1138],[450,1585],[56,1605]]],
 S3: [[[40,290],[432,330],[436,713],[46,712]], [[48,733],[437,736],[443,1118],[50,1137]], [[52,1155],[446,1136],[450,1587],[55,1630]]],
 S4: [[[50,348],[400,357],[410,693],[52,697]], [[56,712],[413,708],[428,1056],[68,1070]], [[70,1090],[430,1076],[447,1468],[88,1505]]] };
const STILL = { S1: 'series-S1-open', S2: 'series-S2-top', S3: 'series-S3-bottom', S4: 'series-S4-middle', S6: 'series-S6-ask' };
const SX = 1080 / 941, SY = 1920 / 1672;
const PAL = [['#C4D2E0', 'Poudre', '#1E2A38'], ['#DCE3EB', 'Marbre', '#1E2A38'], ['#8FA9C2', 'Eau', '#fff'], ['#232A3F', 'Nuit', '#fff'], ['#8E1E44', 'Litchi', '#fff']];
const ARCH = (l, r, top, bot) => { const rr = (r - l) / 2, sy = top + rr; return `M${l},${bot} L${l},${sy} A${rr},${rr} 0 0 1 ${r},${sy} L${r},${bot}`; };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const stage = $('stage');
function homo(w, h, q) {
  const src = [[0, 0], [w, 0], [w, h], [0, h]], M = [], R = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i]; M.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); R.push(u); M.push([0, 0, 0, x, y, 1, -v * x, -v * y]); R.push(v); }
  for (let i = 0; i < 8; i++) { let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
    [M[i], M[p]] = [M[p], M[i]]; [R[i], R[p]] = [R[p], R[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = M[r][i] / M[i][i]; for (let c = i; c < 8; c++) M[r][c] -= f * M[i][c]; R[r] -= f * R[i]; } }
  const H = R.map((b, i) => b / M[i][i]);
  return `matrix3d(${H[0]},${H[3]},0,${H[6]},${H[1]},${H[4]},0,${H[7]},0,0,1,0,${H[2]},${H[5]},0,1)`;
}
const sq = q => q.map(([x, y]) => [x * SX, y * SY]);

/* studio */
const L = {};
function studio(key, img, board) {
  const lay = el('div', 'layer', stage), cam = el('div', 'cam', lay);
  const bg = el('img', 'full', cam); bg.src = ST + STILL[img] + '.webp';
  const talk = el('canvas', 'full', cam); talk.width = 1080; talk.height = 1920; talk.style.display = 'none';
  const o = { lay, cam, bg, talk };
  if (board) {
    const q = QUADS[img].map(sq); o.q = q;
    o.top = el('div', 'panel', cam); o.top.style.transform = homo(720, 700, q[0]); el('div', 'plab', o.top, 'הצבעים');
    o.sw = PAL.map(([h, n, c], i) => { const s = el('div', 'sw', o.top); s.style.right = (34 + i * 132) + 'px'; s.style.background = h;
      el('i', '', s, n).style.color = c; el('b', '', s, h).style.color = c; return s; });
    o.mid = el('div', 'panel', cam); o.mid.style.transform = homo(720, 700, q[1]); el('div', 'plab', o.mid, 'הקוד');
    o.mid.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 300 460"><path class="ar" d="${ARCH(20, 280, 10, 450)}" fill="none" stroke="#B8924A" stroke-width="6" stroke-linecap="round"/>
      <path class="sp" d="M150,${10 + 130 + 30} L150,450" fill="none" stroke="#B8924A" stroke-width="3" stroke-linecap="round"/></svg>`);
    o.codeTxt = el('div', 'codeline', o.mid, 'הדלת · חוזרת בכל מקום');
    o.hero = el('img', 'hero', o.mid); o.hero.src = VA + 'porte/d01.webp'; o.hero.style.objectPosition = '50% 40%';
    o.hero2 = el('img', 'hero', o.mid); o.hero2.src = VA + '20-ecrin-box-open-m.webp';
    o.bot = el('div', 'panel', cam); o.bot.style.transform = homo(720, 700, q[2]); el('div', 'plab', o.bot, 'המוצר');
    o.prod = el('img', 'prod', o.bot); o.prod.src = VA + '09-bottle-blush-garden-m.webp';
    el('img', 'full', cam).src = ST + 'fg/' + img + '.png';
    const t = q[0], cx = (t[0][0] + t[1][0]) / 2, cy = Math.min(t[0][1], t[1][1]);
    o.tag = el('div', 'boardtag', cam, `<div class="nm">VELUNE°</div><div class="no">עולם מותג קונספט No.25 · Brand Worlds Studio</div>`);
    o.tag.style.left = cx + 'px'; o.tag.style.top = (cy - 116) + 'px';
    const m = q[1];
    cam.insertAdjacentHTML('beforeend', `<svg class="trace"><polygon points="${[m[1], m[2], m[3], m[0]].map(p => p.join(',')).join(' ')}" fill="none" stroke="#C9A45C" stroke-width="4" stroke-linejoin="round"/></svg>`);
    o.trace = cam.lastElementChild.querySelector('polygon');
    o.mc = [(m[0][0] + m[1][0] + m[2][0] + m[3][0]) / 4, (m[0][1] + m[1][1] + m[2][1] + m[3][1]) / 4];
  }
  L[key] = o; return o;
}
studio('S1', 'S1', true); studio('S2', 'S2', true); studio('S3', 'S3', true); studio('S4', 'S4', true); studio('S6', 'S6', false);

const WS = {};
