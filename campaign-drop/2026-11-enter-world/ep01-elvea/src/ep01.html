// homography: rect (0,0,w,h) → quad, as CSS matrix3d
function homo(w, h, q) {
  const src = [[0, 0], [w, 0], [w, h], [0, h]], A = [], B = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i];

  for (let i = 0; i < 8; i++) { let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [B[i], B[p]] = [B[p], B[i]];

/* signature */
const SG = el('div', 'layer', stage); SG.id = 'sig';
el('div', 'dim', SG); const gl = el('div', 'gl', SG);
const nm = el('div', 'nm', SG); const NAME = 'Hagit Antebi | Brand Worlds Studio';
const letters = [...NAME].map(ch => el('span', '', nm, ch === ' ' ? ' ' : ch));
const cta = el('div', 'cta', SG, 'אבחון פער המותג <small>· חינם</small> <span class="ar">←</span>');
const site = el('div', 'site', SG, 'hagitantebi.co.il');

/* captions */
const capEls = CAPS.map(([a, b, txt, style]) => {
  const box = el('div', 'capbox ' + style, stage);
  txt.split(' ').forEach(w => { if (w === '|') return el('span', 'cw br', box);
    const k = w.startsWith('*'), x = el('span', 'cw' + (k ? ' key' : ''), box, k ? w.slice(1) : w);
    if (/[A-Za-z]/.test(w)) { x.style.direction = 'ltr'; x.style.unicodeBidi = 'isolate'; } });
  return box; });

const talkImgs = {};
for (const c of TALK) { talkImgs[c.key] = []; for (let i = 1; i <= c.n; i++) { const im = new Image(); im.src = '_build/talk-' + c.key + '/f_' + String(i).padStart(4, '0') + '.jpg'; talkImgs[c.key].push(im); } }
function drawTalk(t) {
  for (const c of TALK) { const o = L[c.key], ims = talkImgs[c.key]; if (!ims.length) continue;
    const f = clamp(Math.round((t - c.t0) * 30), 0, ims.length - 1), im = ims[f]; if (!im.naturalWidth) continue;
    const x = o.talk.getContext('2d'); o.talk.style.display = 'block'; x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, 1080, 1920);
    x.drawImage(im, 0, 0, 1080, 1920);
    if (c.mask) { x.globalCompositeOperation = 'destination-in'; const g = x.createLinearGradient(c.mask[0], 0, c.mask[1], 0);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1920); x.globalCompositeOperation = 'source-over'; } }
  if (L.S6.talk.style.display === 'block') L.S6.talk.style.filter = L.S6.bg.style.filter;
}
const seqImgs = []; for (let i = 1; i <= 80; i++) { const im = new Image(); im.src = EV + 'seq/f_' + String(i).padStart(3, '0') + '.webp'; seqImgs.push(im); }

let lens = null;
function setup() {
  lens = {};
  for (const k of ['S1', 'S2', 'S3', 'S4']) { const o = L[k]; const pl = o.mid.querySelector('.pl'), pd = o.mid.querySelector('.pd');
    o.pl = pl; o.pd = pd; o.pm = o.mid.querySelector('.pm'); o.lL = pl.getTotalLength(); o.lD = pd.getTotalLength();
    pl.style.strokeDasharray = o.lL; pd.style.strokeDasharray = o.lD; const tl = o.trace.getTotalLength(); o.tl = tl; o.trace.style.strokeDasharray = tl; }
}

function board(o, t, mode) {
  // mode 'full' = everything shown (frame-0 proof); 'build' = fills by FILL times
  const full = mode === 'full';
  o.sw.forEach((s, i) => { const p = full ? 1 : eout(lin(t, FILL.top + i * .14, FILL.top + i * .14 + .4)); s.style.transform = `scaleY(${p})`; s.style.opacity = p > 0 ? 1 : 0; });
  const pp = full ? 1 : eout(lin(t, FILL.bot, FILL.bot + .6));
  o.prod.style.opacity = pp; o.prod.style.transform = `translateY(${(1 - pp) * 30}px)`;
  const a = full ? 1 : lin(t, FILL.code, FILL.code + .8), b = full ? 1 : lin(t, FILL.code + .7, FILL.codeEnd);
  o.pl.style.strokeDashoffset = o.lL * (1 - ease(a)); o.pd.style.strokeDashoffset = o.lD * (1 - ease(b));
  const m = full ? 1 : lin(t, FILL.codeEnd - .1, FILL.codeEnd + .2);
  o.pm.setAttribute('r', 9 * m * (1 + .25 * Math.sin(Math.max(0, t - FILL.codeEnd) * 7) * (full ? 0 : 1)));
  o.codeTxt.style.opacity = full ? 1 : lin(t, FILL.codeEnd, FILL.codeEnd + .4);
}

function seek(t) {
  if (!lens) setup();
  const vis = (k, a, b, fi = .0, fo = .0) => { const op = (fi ? lin(t, a, a + fi) : (t >= a ? 1 : 0)) * (fo ? 1 - lin(t, b - fo, b) : (t < b ? 1 : 0)); L[k].lay.style.opacity = op; return op; };
  // S1: frame-0 proof, board complete; tag in from 2.0
  vis('S1', ...SHOT.S1);
  { const o = L.S1; board(o, t, 'full'); const k = 1.0 + .05 * lin(t, 0, SHOT.S1[1]); o.cam.style.transform = `translate(${-540 * (k - 1)}px,${-700 * (k - 1)}px) scale(${k})`;
    o.tag.style.opacity = lin(t, 2.0, 2.4); o.trace.style.strokeDashoffset = o.tl; }
  for (const k of ['S2', 'S3']) { const o = L[k]; vis(k, ...SHOT[k]); board(o, t, 'build'); o.trace.style.strokeDashoffset = o.tl;
    const z = 1.02 + .03 * lin(t, SHOT[k][0], SHOT[k][1]); o.cam.style.transform = `translate(${-300 * (z - 1)}px,${-800 * (z - 1)}px) scale(${z})`; }
  // S4: code draws, then entry through the middle panel; again at the exit
  { const o = L.S4; const inA = t >= SHOT.S4[0] && t < SHOT.S4[1], inX = t >= SHOT.S4x[0] && t < SHOT.S4x[1];
    o.lay.style.opacity = inA ? 1 : inX ? 1 - lin(t, EXIT.toS6, SHOT.S4x[1]) : 0;
    board(o, t, inX ? 'full' : 'build');
    let z, heroOp, tr;
    if (inX) { const p = ease(lin(t, EXIT.at, EXIT.zoomEnd)); z = 1 - p; heroOp = 1; tr = 1;    // z: 1 = fully zoomed in
      }
    else { z = ease(lin(t, ENTRY.zoom, ENTRY.zoomEnd)); heroOp = lin(t, ENTRY.hero, ENTRY.hero + .35); tr = lin(t, ENTRY.trace, ENTRY.trace + .4);
      }
    o.hero.style.opacity = inX ? 0 : heroOp; o.hero2.style.opacity = inX ? 1 : 0; o.trace.style.strokeDashoffset = o.tl * (1 - ease(tr));
    const S = 1 + 4.6 * z, px = o.mc[0] + (540 - o.mc[0]) * z, py = o.mc[1] + (960 - o.mc[1]) * z;
    const base = inX ? 1 : 1.02 + .02 * lin(t, SHOT.S4[0], ENTRY.zoom);
    const s = S * base; o.cam.style.transform = `translate(${px - o.mc[0] * s}px,${py - o.mc[1] * s}px) scale(${s})`; }
  // world
  const wIn = lin(t, ENTRY.world, ENTRY.world + .35), wOut = 1 - lin(t, EXIT.at, EXIT.at + .25);
  W.style.opacity = t >= ENTRY.world && t < EXIT.at + .3 ? Math.min(wIn, wOut) : 0;
  W.style.transform = t >= EXIT.at ? `scale(${1 - .55 * ease(lin(t, EXIT.at, EXIT.at + .3))})` : `scale(${1.25 - .25 * eout(wIn)})`;
  wlabel.style.opacity = Math.min(lin(t, 12.9, 13.3), 1 - lin(t, EXIT.at - .25, EXIT.at));
  for (const [id, a, b] of WORLD) { const s = WS[id]; const op = lin(t, a, a + .3) * (1 - lin(t, b - .3, b)); s.s.style.opacity = op;
    if (s.i) { const k = 1.0 + .07 * lin(t, a, b); s.i.style.transform = `scale(${k})`; } }
  { const f = Math.round(79 * clamp(lin(t, SEQ[0], SEQ[1]))); const im = seqImgs[f], cv = WS.wseq.cv, x = cv.getContext('2d');
    const k = 1.0 + .07 * lin(t, 12.55, 15.3); const sh = im.naturalHeight / k, sw = sh * 980 / 1225;   // cover-crop centred, slow push
    if (im.naturalWidth) x.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, 0, 0, 980, 1225); }
  WS.wbefore.tiles.forEach((d, i) => { const p = eout(lin(t, BEFORE_POP + i * .28, BEFORE_POP + i * .28 + .35)); d.style.opacity = p; d.style.transform = `scale(${.86 + .14 * p}) rotate(${(i % 2 ? 2 : -2) * p}deg)`; });
  WS.wafter.tiles.forEach((d, i) => { const p = eout(lin(t, AFTER_POP + i * .3, AFTER_POP + i * .3 + .35)); d.style.opacity = p; d.style.transform = `scale(${.86 + .14 * p})`;
    d.querySelector('.ring').style.opacity = lin(t, RINGS + i * .15, RINGS + i * .15 + .3);
    const e = lin(t, ERASE + i * .12, ERASE + i * .12 + .35), wm = d.querySelector('.wm');
    wm.style.opacity = 1 - e; wm.style.filter = `blur(${e * 10}px)`; wm.style.transform = `scale(${1 + e * .15})`; });
  { const e = lin(t, ERASE, ERASE + .4), tn = WS.wafter.s.querySelector('.tnm'); tn.style.opacity = 1 - e; tn.style.filter = `blur(${e * 6}px)`; tn.style.maxWidth = (190 * (1 - ease(lin(t, ERASE + .3, ERASE + .7)))) + 'px'; }
  // S6
  { const o = L.S6; o.lay.style.opacity = t >= SHOT.S6[0] ? lin(t, EXIT.toS6, EXIT.toS6 + .3) : 0;
    const k = 1.0 + .07 * lin(t, SHOT.S6[0], SIG); o.cam.style.transform = `translate(${-540 * (k - 1)}px,${-640 * (k - 1)}px) scale(${k})`;
    const sg = lin(t, SIG, SIG + .5); o.bg.style.filter = `blur(${sg * 14}px)`; }
  drawTalk(t);
  // signature
  { const p = lin(t, SIG, SIG + .5); SG.style.opacity = t >= SIG ? 1 : 0; SG.querySelector('.dim').style.opacity = p;
    gl.style.width = (620 * ease(lin(t, SIG + .3, SIG + 1.1))) + 'px';
    letters.forEach((s, i) => { const q = eout(lin(t, SIG + .6 + i * .035, SIG + .6 + i * .035 + .4)); s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 18}px)`; });
    const c = eout(lin(t, SIG + 1.7, SIG + 2.2)), tap = Math.sin(Math.PI * lin(t, SIG + 3.0, SIG + 3.35));
    cta.style.opacity = c; cta.style.transform = `translateX(-50%) translateY(${(1 - c) * 30}px) scale(${1 - .06 * tap})`;
    site.style.opacity = lin(t, SIG + 2.1, SIG + 2.5); }
  // captions
  CAPS.forEach(([a, b], i) => { const e = capEls[i]; const op = a === 0 ? 1 - lin(t, b - .15, b) : lin(t, a, a + .12) * (1 - lin(t, b - .12, b)); e.style.opacity = op;
    const dy = (1 - eout(lin(t, a, a + .2))) * (a === 0 ? 0 : 16); e.style.transform = CAPS[i][3] === 'low' ? `translate(-50%,${dy}px)` : `translateY(${dy}px)`; });
}
window.seek = seek; window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images, ...seqImgs, ...Object.values(talkImgs).flat()].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]).then(() => { seek(0); });
if (location.search.includes('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
</body>
</html>
