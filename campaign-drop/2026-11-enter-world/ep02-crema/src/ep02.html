  Arc: hook to camera (S6) → «בואי ניכנס» + board (S1–S4) → entry through the code panel → world: demo, problem (generic), proof, insight
       → exit → S6: business line + question → signature + CTA (only at the very end).
  window.seek(t) draws one frame; node render.js ep02.html out.mp4 (silent) → bash mux.sh (audio).
  All times come from the TIMING block; VO times (v) are mapped to the final timeline by P1/P2/PQ below — keep mux.sh in step.
-->

<script>
/* ── TIMING ─────────────────────────────────────────────────────────────────────────────────────
   HK = hook recording length, BZ = business-line recording length (0 = not recorded yet → slot skipped).
   VO = ep02-vo-cartesia.wav. Part 1 (v 0–12.5) → T = A + v. Part 2 (v 12.5–30.6) → T = B + v. Question (v 30.6–) → T = Q + v. */
const HK = window.HK ?? 0, BZ = window.BZ ?? 0;
const A = HK ? HK + 0.6 : 0;          // hook + a beat of silence
const B = A + 1.2;                     // room for the entry
const W_END = B + 30.55;               // last world frame
const EXIT = { at: W_END, zoomEnd: W_END + 0.7, toS6: W_END + 0.7 };
const BIZ_T = EXIT.toS6 + 0.3;         // business line starts
const Q = BIZ_T + (BZ ? BZ + 0.4 : 0) - 30.6;   // question part offset
const SIG = Q + 35.04 + 0.35;
const DUR = SIG + 3.6;
const p1 = v => A + v, p2 = v => B + v, pq = v => Q + v;
const SHOT = { HOOK: [0, A], S1: [A, p1(5.15)], S2: [p1(5.15), p1(7.7)], S3: [p1(7.7), p1(9.45)], S4: [p1(9.45), p1(13.9)], S4x: [EXIT.at, EXIT.toS6 + 0.3], S6: [EXIT.toS6, DUR] };
const ENTRY = { hero: p1(12.3), trace: p1(12.4), zoom: p1(12.65), zoomEnd: p1(13.65), world: p1(13.35) };
const FILL = { top: p1(5.6), bot: p1(8.6), code: p1(9.9), codeEnd: p1(11.9) };
const WORLD = [ ['wring', ENTRY.world, p2(15.55)], ['wcups', p2(15.45), p2(19.95)], ['wbefore', p2(19.85), p2(23.55)], ['wafter', p2(23.45), W_END + 0.4] ];
const FILM = [ENTRY.world, p2(15.55)];         // capsule ring frames 1 → 180
const CUPS_T = [p2(15.6), p2(19.9)];           // seven cups, one after another
const BEFORE_POP = p2(20.0), PAN = [p2(23.6), p2(28.2)], RINGS_T = p2(28.3);
const TALK = window.TALK_OFF ? [] : [
  ...(HK ? [{ key: 'S6', n: window.HK_N || 0, t0: 0, dir: 'hook' }] : []),
  { key: 'S6', n: window.Q_N || 0, t0: BIZ_T, dir: 'ask' } ];
const C = (a, b, txt, st) => [a, b, txt, st];
const CAPS = [
  ...(HK ? [C(0, A - 0.1, 'הצבעים שלך יפים. | אבל מה הם *מספרים | עלייך?', 'hook')] : [C(0, 1.9, 'הצבעים שלך יפים. | אבל מה הם *מספרים?', 'hooktop')]),
  C(p1(0.1), p1(1.8), 'בואי ניכנס | לעולם *מותג', 'right'),
  C(p1(1.95), p1(4.75), 'זה *Crema° | עולם מותג | לבית קפה', 'right'),
  C(p1(5.2), p1(7.6), 'למעלה, | שבעה *גוונים', 'right'),
  C(p1(7.75), p1(9.45), 'למטה, | *המוצר', 'right'),
  C(p1(9.5), p1(12.0), 'ובאמצע, | מה שמחבר | ביניהם:', 'right'),
  C(p1(12.0), p1(12.65), '*הקוד', 'right'),
  C(p2(12.7), p2(14.15), 'צבע הוא | לא קישוט.', 'low'),
  C(p2(14.15), p2(15.5), 'הוא *סיפור.', 'low'),
  C(p2(15.6), p2(17.95), 'כל קלייה | מקבלת גוון *משלה', 'low'),
  C(p2(17.95), p2(19.8), 'והגוון הופך | *לבוקר', 'low'),
  C(p2(19.95), p2(21.35), 'ברוב המותגים,', 'low'),
  C(p2(21.35), p2(23.35), 'הצבעים נבחרים | כי הם *יפים', 'low'),
  C(p2(23.5), p2(24.15), 'כאן,', 'low'),
  C(p2(24.15), p2(28.15), 'כל צבע אומר משהו: | איזה בוקר, *ושל מי', 'low'),
  C(p2(28.2), p2(30.45), 'וככה הגוון לבד | כבר מספר את *הסיפור', 'low'),
  ...(BZ ? [C(BIZ_T, BIZ_T + BZ * .30, 'כשהשפה של המותג שלך | *ברורה,', 'low'),
            C(BIZ_T + BZ * .30, BIZ_T + BZ * .76, 'את לא צריכה להסביר | בכל פעם מחדש מי את', 'low'),
            C(BIZ_T + BZ * .76, BIZ_T + BZ, 'ולמה לבחור | *דווקא בך.', 'low')] : []),
  C(pq(31.15), pq(32.65), 'המותג שלך | כבר *קיים.', 'low'),
  C(pq(32.65), pq(34.75), 'השאלה היא: | מה הצבעים שלך | *מספרים?', 'low'),
];
/* ─────────────────────────────────────────────────────────────────────────────────────────────── */
const ST = '../../studio/', CR = '../../../../images/crema/';
const QUADS = {
 S1: [[[48,288],[428,320],[436,667],[51,667]], [[53,686],[437,684],[443,1018],[57,1037]], [[60,1057],[445,1040],[452,1475],[70,1515]]],
 S2: [[[48,293],[434,332],[436,712],[48,713]], [[52,732],[438,733],[443,1118],[54,1137]], [[54,1157],[446,1138],[450,1585],[56,1605]]],
 S3: [[[40,290],[432,330],[436,713],[46,712]], [[48,733],[437,736],[443,1118],[50,1137]], [[52,1155],[446,1136],[450,1587],[55,1630]]],
 S4: [[[50,348],[400,357],[410,693],[52,697]], [[56,712],[413,708],[428,1056],[68,1070]], [[70,1090],[430,1076],[447,1468],[88,1505]]] };
const STILL = { S1: 'series-S1-open', S2: 'series-S2-top', S3: 'series-S3-bottom', S4: 'series-S4-middle', S6: 'series-S6-ask' };
const SX = 1080 / 941, SY = 1920 / 1672;
const ROAST = [['ristretto', 'Ristretto', '#D2382B', '06:10', 'עז ונועז'], ['arancia', 'Arancia', '#E07F2A', '06:40', 'רמז של תפוז'], ['miele', 'Miele', '#E3B23C', '07:05', 'דבש וחמאה'],
  ['foresta', 'Foresta', '#4F9D58', '07:30', 'אגוזי לוז'], ['onda', 'Onda', '#3C84C2', '08:00', 'מאוזן וקטיפתי'], ['viola', 'Viola', '#7C5BAF', '08:45', 'עמוק ופרחוני'], ['rosa', 'Rosa', '#D24E86', '09:20', 'פירותי ועדין']];
// rim of the cup in the 1024² photos: centre (0.497, 0.469) of the side, outer radius 0.223
const RIM = { cx: .497, cy: .469, r: .223 };

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const stage = $('stage');
function homo(w, h, q) {
  const src = [[0, 0], [w, 0], [w, h], [0, h]], M = [], R = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i];
    M.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); R.push(u); M.push([0, 0, 0, x, y, 1, -v * x, -v * y]); R.push(v); }
  for (let i = 0; i < 8; i++) { let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
    [M[i], M[p]] = [M[p], M[i]]; [R[i], R[p]] = [R[p], R[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = M[r][i] / M[i][i]; for (let c = i; c < 8; c++) M[r][c] -= f * M[i][c]; R[r] -= f * R[i]; } }
  const H = R.map((b, i) => b / M[i][i]);
  return `matrix3d(${H[0]},${H[3]},0,${H[6]},${H[1]},${H[4]},0,${H[7]},0,0,1,0,${H[2]},${H[5]},0,1)`;
}
const sq = q => q.map(([x, y]) => [x * SX, y * SY]);

/* studio */
const L = {};
function studio(key, img, board) {
  const lay = el('div', 'layer', stage), cam = el('div', 'cam', lay);
  const bg = el('img', 'full', cam); bg.src = ST + STILL[img] + '.webp';
  const talk = el('canvas', 'full', cam); talk.width = 1080; talk.height = 1920; talk.style.display = 'none';
  const o = { lay, cam, bg, talk };
  if (board) {
    const q = QUADS[img].map(sq); o.q = q;
    o.top = el('div', 'panel', cam); o.top.style.transform = homo(720, 700, q[0]); el('div', 'plab', o.top, 'הצבעים');
    o.sw = ROAST.map(([, n, h], i) => { const s = el('div', 'sw', o.top); s.style.right = (32 + i * 94) + 'px'; s.style.background = h; el('i', '', s, n); return s; });
    o.mid = el('div', 'panel', cam); o.mid.style.transform = homo(720, 700, q[1]); el('div', 'plab', o.mid, 'הקוד');
    o.mid.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 400 430"><g fill="none" stroke-linecap="round">
      <circle class="saucer" cx="190" cy="215" r="185" stroke="#B9A48C" stroke-width="3"/>
      <path class="handle" d="M 312 190 Q 372 190 372 215 Q 372 240 312 240" stroke="#B9A48C" stroke-width="3"/>
      <circle class="cup" cx="190" cy="215" r="120" stroke="#8A7563" stroke-width="3"/>
      <circle class="rim" cx="190" cy="215" r="112" stroke="#D2382B" stroke-width="16"/>
      <circle class="crema" cx="190" cy="215" r="100" fill="#B98A5E" stroke="none" opacity="0"/></g></svg>`);
    o.codeTxt = el('div', 'codeline', o.mid, 'הגוון של הקלייה · על שפת הכוס');
    o.hero = el('img', 'hero', o.mid); o.hero.src = 'film-first.jpg';
    o.hero2 = el('img', 'hero', o.mid); o.hero2.src = CR + 'cup-onda-heart.jpg';
    o.bot = el('div', 'panel', cam); o.bot.style.transform = homo(720, 700, q[2]); el('div', 'plab', o.bot, 'המוצר');
    o.prod = el('img', 'prod', o.bot); o.prod.src = CR + 'cup-foresta-heart.jpg';
    el('img', 'full', cam).src = ST + 'fg/' + img + '.png';
    const t = q[0], cx = (t[0][0] + t[1][0]) / 2, cy = Math.min(t[0][1], t[1][1]);
    o.tag = el('div', 'boardtag', cam, `<div class="nm">Crema°</div><div class="no">עולם מותג קונספט No.20 · Brand Worlds Studio</div>`);
    o.tag.style.left = cx + 'px'; o.tag.style.top = (cy - 116) + 'px';
    const m = q[1];
    cam.insertAdjacentHTML('beforeend', `<svg class="trace"><polygon points="${[m[1], m[2], m[3], m[0]].map(p => p.join(',')).join(' ')}" fill="none" stroke="#C9A45C" stroke-width="4" stroke-linejoin="round"/></svg>`);
    o.trace = cam.lastElementChild.querySelector('polygon');
    o.mc = [(m[0][0] + m[1][0] + m[2][0] + m[3][0]) / 4, (m[0][1] + m[1][1] + m[2][1] + m[3][1]) / 4];
  }
  L[key] = o; return o;
