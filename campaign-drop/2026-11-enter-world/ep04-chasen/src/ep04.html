  Arc: hook to camera (S6) → board → entry through the whisk → the film (powder, whisk, pour) with the promise as type
       → problem (a generic café menu) → proof (the glass answers each verb: choose a flavour, add cream, it gets a name)
       → insight (the hands whisking at the workshop) → exit → S6: business line + question → signature + CTA.
  Separate recordings in voice/; timeline formulas here and in src/mux.py must match.

<script>
/* ── TIMING ── recordings in voice/: hook · studio · world · biz (shared) · ask-q. Sentence times inside each file come from its pauses. */
const HK = window.HK ?? 0, SD = window.SD ?? 11.84, WD = window.WD ?? 20.08, BZ = window.BZ ?? 0, QD = window.QD ?? 3.84;
const A = HK ? HK + 0.6 : 0;
const B = A + SD + 2.0;
const W_END = B + WD + 0.2;
const EXIT = { at: W_END, zoomEnd: W_END + 0.7, toS6: W_END + 0.7 };
const BIZ_T = EXIT.toS6 + 0.3;
const QT = BIZ_T + (BZ ? BZ + 0.4 : 0);
const SIG = QT + QD + 0.35, DUR = SIG + 3.6;
const p1 = v => A + v, p2 = v => B + v, pq = v => QT + v;
const SHOT = { HOOK: [0, A], S1: [A, p1(5.1)], S2: [p1(5.1), p1(6.9)], S3: [p1(6.9), p1(9.05)], S4: [p1(9.05), p1(13.6)], S4x: [EXIT.at, EXIT.toS6 + 0.3], S6: [EXIT.toS6, DUR] };
const ENTRY = { hero: p1(11.2), trace: p1(11.3), zoom: p1(11.75), zoomEnd: p1(12.75), world: p1(12.45) };
const FILL = { top: p1(5.6), bot: p1(8.0), code: p1(9.2), codeEnd: p1(11.5) };
const FILM = [['poudre', ENTRY.world, p2(1.5), 20], ['chasen', p2(1.5), p2(3.0), 10], ['verre', p2(3.0), p2(4.45), 25]];   // [clip, from, to, first frame]
const WORLD = [['wfilm', ENTRY.world, p2(4.55)], ['wbefore', p2(4.45), p2(10.0)], ['wglass', p2(9.9), p2(16.7)], ['wmains', p2(16.6), W_END + 0.4]];
const BIG = [[p2(1.75), p2(3.0), 'לא מזמינים.'], [p2(3.1), p2(4.45), 'מרכיבים.']];
const MENU_POP = p2(4.6), FLAVOR = [p2(12.55), p2(12.9), p2(13.2)], CREAM = p2(13.4), CARD = [p2(14.85), p2(16.7)];
const VERBS = [[p2(12.5), p2(13.3), 'בחרי טעם'], [p2(13.35), p2(14.6), 'הוסיפי קצפת'], [p2(14.9), p2(16.5), 'שם משלה']];
const TALK = window.TALK_OFF ? [] : [ ...(HK ? [{ n: window.HK_N || 0, t0: 0, dir: 'hook' }] : []), { n: window.Q_N || 0, t0: BIZ_T, dir: 'ask' } ];
const C = (a, b, txt, st) => [a, b, txt, st];
const CAPS = [
  ...(HK ? [C(0, A - 0.1, 'המותג שלך | מדבר *כמו תפריט?', 'hook')] : [C(0, 1.9, 'המותג שלך | מדבר *כמו תפריט?', 'hooktop')]),
  C(p1(0.12), p1(1.75), 'בואי ניכנס | לעולם *מותג', 'right'),
  C(p1(1.85), p1(4.95), 'זה *CHASEN° | עולם מותג | לבר מאצ\'ה', 'right'),
  C(p1(5.15), p1(6.85), 'למעלה, | *הצבעים', 'right'),
  C(p1(6.95), p1(9.05), 'למטה, | *המוצר', 'right'),
  C(p1(9.1), p1(11.38), 'ובאמצע, | מה שמחבר | ביניהם:', 'right'),
  C(p1(11.38), p1(12.0), '*הקוד', 'right'),
  C(p2(0.12), p2(1.6), 'כאן הקוד | הוא גם *שפה:', 'low'),
  C(p2(4.45), p2(7.35), 'ברוב המותגים, | השפה היא *תפריט:', 'low'),
  C(p2(7.45), p2(9.75), 'שם, מחיר, | *הוסיפי לסל.', 'low'),
  C(p2(10.15), p2(12.5), 'כאן, כל מילה | היא *פעולה:', 'low'),
  C(p2(12.5), p2(14.75), 'בחרי טעם, | *הוסיפי קצפת,', 'low'),
  C(p2(14.8), p2(16.6), 'והכוס מקבלת | שם *משלה.', 'low'),
  C(p2(16.85), p2(18.8), 'וככה הלקוחה | היא לא רק *קונה.', 'low'),
  C(p2(18.85), W_END, 'היא זו *שמכינה.', 'low'),
  ...(BZ ? [C(BIZ_T, BIZ_T + BZ * .30, 'כשהשפה של המותג שלך | *ברורה,', 'low'),
            C(BIZ_T + BZ * .30, BIZ_T + BZ * .76, 'את לא צריכה להסביר | בכל פעם מחדש מי את', 'low'),
            C(BIZ_T + BZ * .76, BIZ_T + BZ + .2, 'ולמה לבחור | *דווקא בך.', 'low')] : []),
  C(pq(0.05), pq(1.7), 'המותג שלך | כבר *קיים.', 'low'),
  C(pq(1.75), pq(QD), 'השאלה היא: | איך הוא *מדבר?', 'low'),
];
/* ─────────────────────────────────────────────────────────────────────────────────────────────── */
const ST = '../../studio/', CH = '../../../../chasen/';
const QUADS = {
 S1: [[[48,288],[428,320],[436,667],[51,667]], [[53,686],[437,684],[443,1018],[57,1037]], [[60,1057],[445,1040],[452,1475],[70,1515]]],
 S2: [[[48,293],[434,332],[436,712],[48,713]], [[52,732],[438,733],[443,1118],[54,1137]], [[54,1157],[446,1138],[450,1585],[56,1605]]],
 S3: [[[40,290],[432,330],[436,713],[46,712]], [[48,733],[437,736],[443,1118],[50,1137]], [[52,1155],[446,1136],[450,1587],[55,1630]]],
 S4: [[[50,348],[400,357],[410,693],[52,697]], [[56,712],[413,708],[428,1056],[68,1070]], [[70,1090],[430,1076],[447,1468],[88,1505]]] };
const STILL = { S1: 'series-S1-open', S2: 'series-S2-top', S3: 'series-S3-bottom', S4: 'series-S4-middle', S6: 'series-S6-ask' };
const SX = 1080 / 941, SY = 1920 / 1672;
const PAL = [['#6F9A3F', 'Classique'], ['#D98A95', 'Fraise'], ['#A8794F', 'Hōjicha'], ['#E5C85A', 'Yuzu'], ['#7F8FC9', 'Bleu']];
// whisk: handle + a fan of tines
const WHISK = 'M118,20 L142,20 L142,190 L118,190 Z M108,190 L152,190 L150,214 L110,214 Z ' +
  [...Array(13)].map((_, i) => { const x = 40 + i * 15, c = 130; return `M${c + (x - c) * .12},214 Q${c + (x - c) * .55},270 ${x},420`; }).join(' ');

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const stage = $('stage');
function homo(w, h, q) {
  const src = [[0, 0], [w, 0], [w, h], [0, h]], M = [], R = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i]; M.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); R.push(u); M.push([0, 0, 0, x, y, 1, -v * x, -v * y]); R.push(v); }
  for (let i = 0; i < 8; i++) { let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
    [M[i], M[p]] = [M[p], M[i]]; [R[i], R[p]] = [R[p], R[i]];
    for (let r = 0; r < 8; r++) if (r !== i) { const f = M[r][i] / M[i][i]; for (let c = i; c < 8; c++) M[r][c] -= f * M[i][c]; R[r] -= f * R[i]; } }
  const H = R.map((b, i) => b / M[i][i]);
  return `matrix3d(${H[0]},${H[3]},0,${H[6]},${H[1]},${H[4]},0,${H[7]},0,0,1,0,${H[2]},${H[5]},0,1)`;
}
const sq = q => q.map(([x, y]) => [x * SX, y * SY]);

/* studio */
const L = {};
function studio(key, img, board) {
  const lay = el('div', 'layer', stage), cam = el('div', 'cam', lay);
  const bg = el('img', 'full', cam); bg.src = ST + STILL[img] + '.webp';
  const talk = el('canvas', 'full', cam); talk.width = 1080; talk.height = 1920; talk.style.display = 'none';
  const o = { lay, cam, bg, talk };
  if (board) {
    const q = QUADS[img].map(sq); o.q = q;
    o.top = el('div', 'panel', cam); o.top.style.transform = homo(720, 700, q[0]); el('div', 'plab', o.top, 'הצבעים');
    o.sw = PAL.map(([h, n], i) => { const s = el('div', 'sw', o.top); s.style.right = (34 + i * 132) + 'px'; s.style.background = h; el('i', '', s, n); el('b', '', s, h); return s; });
    o.mid = el('div', 'panel', cam); o.mid.style.transform = homo(720, 700, q[1]); el('div', 'plab', o.mid, 'הקוד');
    o.mid.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 260 440"><path class="wk" d="${WHISK}" fill="none" stroke="#4C6B33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    o.codeTxt = el('div', 'codeline', o.mid, 'לא מזמינים. מרכיבים.');
    o.hero = el('img', 'hero', o.mid); o.hero.src = CH + 'assets/chasen.webp';
    o.hero2 = el('img', 'hero', o.mid); o.hero2.src = CH + 'assets/touchpoints/card.webp'; o.hero2.style.objectPosition = '50% 40%';
    o.bot = el('div', 'panel', cam); o.bot.style.transform = homo(720, 700, q[2]); el('div', 'plab', o.bot, 'המוצר');
    o.prod = el('img', 'prod', o.bot); o.prod.src = CH + 'img/glass_classic.webp';
    el('img', 'full', cam).src = ST + 'fg/' + img + '.png';
    const t = q[0], cx = (t[0][0] + t[1][0]) / 2, cy = Math.min(t[0][1], t[1][1]);
    o.tag = el('div', 'boardtag', cam, `<div class="nm">CHASEN°</div><div class="no">עולם מותג קונספט No.22 · Brand Worlds Studio</div>`);
    o.tag.style.left = cx + 'px'; o.tag.style.top = (cy - 116) + 'px';
    const m = q[1];
    cam.insertAdjacentHTML('beforeend', `<svg class="trace"><polygon points="${[m[1], m[2], m[3], m[0]].map(p => p.join(',')).join(' ')}" fill="none" stroke="#C9A45C" stroke-width="4" stroke-linejoin="round"/></svg>`);
    o.trace = cam.lastElementChild.querySelector('polygon');
    o.mc = [(m[0][0] + m[1][0] + m[2][0] + m[3][0]) / 4, (m[0][1] + m[1][1] + m[2][1] + m[3][1]) / 4];
  }
  L[key] = o; return o;
}
studio('S1', 'S1', true); studio('S2', 'S2', true); studio('S3', 'S3', true); studio('S4', 'S4', true); studio('S6', 'S6', false);
/* orbit: hook = the five cups + the whisk (frame-0 proof) · business line = the touchpoints · question = they drift away */
const ORBIT = { cx: 540, cy: 700, rx: 420, ry: 480, speed: 0.16 };
const OSETS = { hook: ['img/glass_classic.webp', 'img/glass_fraise.webp', 'img/glass_hojicha.webp', 'assets/chasen.webp', 'img/glass_yuzu.webp', 'img/glass_bleu.webp'],
  biz: ['assets/touchpoints/five.webp', 'assets/touchpoints/kit.webp', 'assets/touchpoints/wall.webp', 'assets/touchpoints/card.webp', 'assets/touchpoints/bag.webp', 'assets/lecon/mains.webp'] };
const orbitEl = el('div', '', stage); orbitEl.id = 'orbit';
const OC = {}; for (const [k, list] of Object.entries(OSETS)) OC[k] = list.map((src, i) => { const c = el('div', 'oc', orbitEl); const im = el('img', '', c); im.src = '../../../../chasen/' + src;
  if (/glass_/.test(src)) im.style.objectPosition = '50% 30%'; return c; });
function orbit(t, set, t0, t1, mode) {
  OC[set].forEach((c, i) => { const n = OC[set].length, inT = t >= t0 - .1 && t < t1 + .6;
    if (!inT) { c.style.opacity = 0; return; }
    const a = -Math.PI / 2 + i * 2 * Math.PI / n + (t - t0) * ORBIT.speed, depth = (Math.sin(a) + 1) / 2;
    let x = ORBIT.cx + ORBIT.rx * Math.cos(a), y = ORBIT.cy + ORBIT.ry * Math.sin(a) + 14 * Math.sin(t * 1.3 + i);
    let sc = .74 + .3 * depth, op = 1, rot = (i % 2 ? 5 : -6) + 3 * Math.sin(t * .9 + i * 1.7);
    const pop = mode === 'still' ? 1 : eout(lin(t, t0 + i * .16, t0 + i * .16 + .45));
    const out = ease(lin(t, t1, t1 + .6));                       // drift away from her at the end of the set
    x += (x - ORBIT.cx) * .9 * out; y += (y - ORBIT.cy) * .9 * out; op = pop * (1 - out);
    c.style.opacity = op; c.style.zIndex = Math.round(depth * 10);
    c.style.transform = `translate(${x}px,${y}px) scale(${sc * (.6 + .4 * pop)}) rotate(${rot}deg)`; });
}

/* world */
const W = el('div', 'layer', stage); W.id = 'world';
