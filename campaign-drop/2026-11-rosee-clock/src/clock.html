<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>ROSÉE° dawn clock reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Assistant:wght@300;400&family=Frank+Ruhl+Libre:wght@500&display=swap">
<style>
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
  .preload{position:fixed;top:0;left:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="preload">
  <span style="font-family:'Frank Ruhl Libre';font-weight:500">א</span>
  <span style="font-family:'Cormorant Garamond';font-weight:500">a</span>
  <span style="font-family:'Assistant';font-weight:300">א</span>
</div>
<script>
// Dawn clock. Deterministic: window.show(t) draws the frame at t seconds. Loop length = DUR.
// The hand steps from product to product; a dew drop leaves its tip and wakes the product it points at.
const W = 1080, H = 1920;
const STEP = 2.0;            // seconds per product
const MOVE = 0.9;            // the last MOVE seconds of a step are the hand travelling to the next product
const T0 = 0.55;             // frame 0 sits 0.55s after an arrival: the product is already awake
const C = { x: 540, y: 1010 }, RING = 400, HAND = 122, BALL = 25;
const INK = '#3B2E33', SOFT = '#6E5A61', COPPER = '#C28A5A', ROSE = '#E8B4B8', DEEP = '#C9878E', LINEN = '#FBF6EE';

const PRODUCTS = [
  { id: 'brume',   fr: 'La Brume',   hour: '05:30', pose: 'sit' },
  { id: 'reveil',  fr: 'Le Réveil',  hour: '06:15', pose: 'wave' },
  { id: 'voile',   fr: 'Le Voile',   hour: '07:00', pose: 'stand' },
  { id: 'lumiere', fr: 'La Lumière', hour: '07:45', pose: 'sit' },
  { id: 'nuit',    fr: 'La Nuit',    hour: '22:00', pose: 'wave' },
];
const N = PRODUCTS.length, DUR = N * STEP;
const ANG = k => -Math.PI / 2 + k * 2 * Math.PI / N;       // product k on the dial, clockwise from the top

// Miniature Hagit. Anchor = hips when sitting, feet when standing or jumping (px in the asset).
const FIG = {
  sit:   { src: 'figure/sit.png',   ax: 166, ay: 303.5, k: 0.36 },
  wave:  { src: 'figure/wave.png',  ax: 90,  ay: 313.5, k: 0.425 },
  stand: { src: 'figure/stand.png', ax: 206, ay: 516.5, k: 0.40 },
  jump:  { src: 'figure/jump.png',  ax: 164, ay: 525,   k: 0.42 },
};
const load = (o, src) => new Promise(res => { o.im = new Image(); o.im.onload = res; o.im.src = src; });
const ready = Promise.all([
  ...PRODUCTS.map(p => load(p, 'products/' + p.id + '.jpg')),
  ...Object.values(FIG).map(f => load(f, f.src)),
  document.fonts.ready,
]);

const cv = document.getElementById('c'), g = cv.getContext('2d');
// ?fmt=45 renders the 4:5 feed version: the same scene, scaled to fit 1080x1350.
const FEED = new URLSearchParams(location.search).get('fmt') === '45';
const OUT_H = FEED ? 1350 : H, FIT = FEED ? 1350 / 1530 : 1, FIT_TOP = FEED ? 195 : 0;
cv.height = OUT_H; cv.style.height = OUT_H + 'px';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const mod = (a, n) => ((a % n) + n) % n;
const backOut = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

function dewBall(x, y, r) {
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  gr.addColorStop(0, '#FFF7F4'); gr.addColorStop(0.45, '#F2C9CB'); gr.addColorStop(1, DEEP);
  g.save(); g.shadowColor = 'rgba(120,70,70,.28)'; g.shadowBlur = 16; g.shadowOffsetY = 6;
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(x - r * 0.34, y - r * 0.4, r * 0.2, r * 0.13, -0.6, 0, 7); g.fill();
}

function show(tRaw) {
  const t = mod(tRaw, DUR);
  const u = (t + T0) / STEP, k = Math.floor(u), tau = (u - k) * STEP;   // tau: seconds since the hand arrived at product k
  const s = mod(k, N);
  const moving = tau > STEP - MOVE;
  const mv = moving ? (tau - (STEP - MOVE)) / MOVE : 0;                 // 0..1 while travelling to the next product
  const a = ANG(k) + (moving ? backOut(mv) : 0) * 2 * Math.PI / N;      // hand angle
  // wake level of every product: full while the hand rests on it, then a slow fade
  const wake = PRODUCTS.map((_, i) => {
    const since = mod(t + T0 - i * STEP, DUR);                          // seconds since the hand arrived at product i
    return Math.max(smooth(0.2, 0.55, since) * (1 - smooth(STEP - 0.25, STEP + 1.5, since)), 0);
  });

  g.setTransform(FIT, 0, 0, FIT, (W - W * FIT) / 2, -FIT_TOP * FIT);
  g.fillStyle = LINEN; g.fillRect(-600, -600, W + 1200, H + 1200);
  const bgG = g.createRadialGradient(C.x, C.y - 60, 80, C.x, C.y, 1150);
  bgG.addColorStop(0, 'rgba(255,255,255,.9)'); bgG.addColorStop(0.5, 'rgba(247,240,230,.6)'); bgG.addColorStop(1, 'rgba(232,180,184,.34)');
  g.fillStyle = bgG; g.fillRect(-600, -600, W + 1200, H + 1200);

  // --- dawn light trailing the hand
  const cg = g.createConicGradient(a, C.x, C.y);
  cg.addColorStop(0, 'rgba(232,180,184,0)'); cg.addColorStop(0.72, 'rgba(232,180,184,0)');
  cg.addColorStop(0.985, 'rgba(232,180,184,.42)'); cg.addColorStop(1, 'rgba(232,180,184,.5)');
  g.save(); g.beginPath(); g.arc(C.x, C.y, RING - 122, 0, 7); g.clip();
  g.fillStyle = cg; g.fillRect(C.x - RING, C.y - RING, RING * 2, RING * 2); g.restore();

  // --- dial: ring and minute marks
  g.strokeStyle = 'rgba(194,138,90,.38)'; g.lineWidth = 2;
  g.beginPath(); g.arc(C.x, C.y, RING, 0, 7); g.stroke();
  for (let i = 0; i < 60; i++) {
    const an = i * Math.PI / 30, r1 = RING - 122, r0 = r1 - (i % 5 ? 10 : 22);
    g.globalAlpha = i % 5 ? .28 : .6; g.lineWidth = i % 5 ? 1.5 : 2.5; g.strokeStyle = COPPER;
    g.beginPath(); g.moveTo(C.x + Math.cos(an) * r0, C.y + Math.sin(an) * r0);
    g.lineTo(C.x + Math.cos(an) * r1, C.y + Math.sin(an) * r1); g.stroke();
  }
  g.globalAlpha = 1;

  // --- hook, fixed
  g.fillStyle = INK; g.textAlign = 'center'; g.direction = 'rtl';
  g.font = "500 80px 'Frank Ruhl Libre'";
  g.fillText('חמישה מוצרים.', 540, 318);
  g.fillText('רואים שזה אותו מותג?', 540, 414);

  // --- products around the dial
  PRODUCTS.forEach((p, i) => {
    const w = wake[i], an = ANG(i);
    const x = C.x + Math.cos(an) * RING, y = C.y + Math.sin(an) * RING;
    const r = 98 + 34 * w + (i === s ? 6 * Math.sin(clamp((tau - 0.2) / 0.5) * Math.PI) : 0);
    g.save();
    g.shadowColor = `rgba(150,90,90,${0.10 + 0.22 * w})`; g.shadowBlur = 14 + 30 * w; g.shadowOffsetY = 6 + 10 * w;
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.restore();
    g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip();
    g.filter = `grayscale(${(1 - w) * 0.85}) brightness(${1 + (1 - w) * 0.06})`;
    g.drawImage(p.im, x - r, y - r, r * 2, r * 2);
    g.filter = 'none';
    g.fillStyle = `rgba(251,246,238,${(1 - w) * 0.36})`; g.fillRect(x - r, y - r, r * 2, r * 2);   // asleep: veiled
    g.restore();
    g.strokeStyle = COPPER; g.globalAlpha = 0.35 + 0.65 * w; g.lineWidth = 2 + 2 * w;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.globalAlpha = 1;
  });

  // --- the drop that leaves the tip and wakes the product
  const tipX = C.x + Math.cos(a) * HAND, tipY = C.y + Math.sin(a) * HAND;
  if (!moving && tau < 0.26) {
    const e = tau / 0.26, r0 = HAND + BALL, r1 = RING - 118;
    const rr = r0 + (r1 - r0) * e * e;
    dewBall(C.x + Math.cos(a) * rr, C.y + Math.sin(a) * rr, 11 * (1 - e * 0.25));
  }
  if (!moving && tau > 0.2 && tau < 0.75) {                       // ripple on impact
    const e = (tau - 0.2) / 0.55, x = C.x + Math.cos(a) * RING, y = C.y + Math.sin(a) * RING;
    g.strokeStyle = DEEP; g.globalAlpha = (1 - e) * 0.7; g.lineWidth = 3 * (1 - e) + 1;
    g.beginPath(); g.arc(x, y, 132 + e * 46, 0, 7); g.stroke(); g.globalAlpha = 1;
  }

  // --- hand
  g.save(); g.lineCap = 'round'; g.strokeStyle = COPPER; g.lineWidth = 6;
  g.shadowColor = 'rgba(120,70,60,.25)'; g.shadowBlur = 8; g.shadowOffsetY = 4;
  g.beginPath(); g.moveTo(C.x - Math.cos(a) * 34, C.y - Math.sin(a) * 34); g.lineTo(tipX, tipY); g.stroke();
  g.restore();
  g.fillStyle = COPPER; g.beginPath(); g.arc(C.x, C.y, 11, 0, 7); g.fill();
  g.fillStyle = LINEN; g.beginPath(); g.arc(C.x, C.y, 4, 0, 7); g.fill();
  dewBall(tipX, tipY, BALL);

  // --- the figure rides the drop at the tip; she changes pose with a hop halfway through each move
  let pose = PRODUCTS[s].pose, lift = 0, lean = 0;
  if (moving) {
    const hop = clamp(1 - Math.abs(mv - 0.5) / 0.3);            // 0..1 around the middle of the move
    if (hop > 0) { pose = 'jump'; lift = 26 + 62 * Math.sin(hop * Math.PI / 2); }
    else if (mv > 0.5) pose = PRODUCTS[mod(s + 1, N)].pose;
    lean = Math.sin(mv * Math.PI) * 0.16;                       // leans into the turn
  } else if (tau < 0.3) lift = 0;
  const f = FIG[pose];
  g.save();
  g.translate(tipX, tipY - BALL + 5 - lift + (pose === 'jump' ? 30 : 0));
  g.rotate(lean);
  g.shadowColor = 'rgba(90,50,50,.28)'; g.shadowBlur = 12; g.shadowOffsetY = 5;
  g.drawImage(f.im, -f.ax * f.k, -f.ay * f.k, f.im.width * f.k, f.im.height * f.k);
  g.restore();

  // --- tag: hour + name of the product the hand rests on
  const tagA = Math.min(smooth(0.15, 0.45, tau), 1 - smooth(STEP - MOVE, STEP - MOVE + 0.3, tau));
  g.save(); g.globalAlpha = tagA; g.fillStyle = INK; g.direction = 'ltr';
  g.font = "500 46px 'Cormorant Garamond'"; g.letterSpacing = '3px';
  g.fillText(PRODUCTS[s].hour + ' · ' + PRODUCTS[s].fr, 540, 1560);
  g.restore();

  // --- signature, fixed
  g.direction = 'ltr'; g.fillStyle = INK; g.globalAlpha = .92;
  g.font = "500 40px 'Cormorant Garamond'"; g.letterSpacing = '10px';
  g.fillText('ROSÉE°', 545, 1636);
  g.letterSpacing = '0px'; g.globalAlpha = .7; g.direction = 'rtl'; g.fillStyle = SOFT;
  g.font = "300 26px 'Assistant'";
  g.fillText('עולם מותג · Brand Worlds Studio', 540, 1676);
  g.globalAlpha = 1;
}
window.show = show;
window.ready = ready;
window.DUR = DUR;
ready.then(() => {
  show(0);
  if (new URLSearchParams(location.search).has('play')) {
    const t0 = performance.now();
    (function loop() { show((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
  }
});
</script>
</body>
</html>
