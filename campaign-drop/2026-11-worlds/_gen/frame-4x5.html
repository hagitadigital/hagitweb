<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&display=swap">
<style>
/* 4:5 feed frame, Brand Worlds Studio feed tokens: cream side panels, copper rule, copper-text labels */
html,body{margin:0;width:1080px;height:1350px;background:transparent}
.side{position:absolute;top:0;bottom:0;width:160px;background:#F2EBDC}
.l{left:0}.r{right:0}
.rule{position:absolute;top:60px;bottom:60px;width:1px;background:rgba(194,138,90,.5)}
.v{position:absolute;top:50%;left:50%;white-space:nowrap;font-family:'Plus Jakarta Sans','Heebo',sans-serif;font-size:17px;font-weight:500;letter-spacing:.42em;color:#825630}
.l .v{transform:translate(-50%,-50%) rotate(-90deg)}
.r .v{transform:translate(-50%,-50%) rotate(90deg)}
</style></head><body>
<div class="side l"><div class="rule" style="right:22px"></div><div class="v">BRAND WORLDS STUDIO</div></div>
<div class="side r"><div class="rule" style="left:22px"></div><div class="v">HAGITANTEBI.CO.IL</div></div>
</body></html>
