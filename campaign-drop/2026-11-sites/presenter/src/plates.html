<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600&display=swap">
<style>
:root{--cream:#FAF8F3;--beige:#F5F1E8;--sand:#EFE8DC;--ink:#2A201A;--deep:#4F372C;--muted:#7A6349;--copper:#C4765A;--cd:#A45839;--line:#D4C9BC;
--latin:"Cormorant Garamond",serif;--display:"Frank Ruhl Libre",serif;--body:"Heebo",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:var(--body);color:var(--deep)}
#st{position:absolute;inset:0}
.abs{position:absolute}
.hook{top:200px;left:50px;right:50px;text-align:center;font:500 70px/1.16 var(--display);color:var(--ink)}
.hook b{font-weight:500;color:var(--cd)}
.label{left:60px;right:60px;text-align:center;font:500 62px/1.1 var(--display);color:var(--ink)}
.label small{display:block;margin-top:12px;font:400 31px/1.3 var(--body);color:var(--muted)}
.card{width:960px;left:60px;border-radius:22px;background:#FBF8F2;box-shadow:0 40px 80px -44px #2b1a1280,0 0 0 2px var(--line);overflow:hidden;transform-origin:50% 0}
.snav{display:flex;align-items:center;gap:30px;height:74px;padding:0 34px;font-size:25px;color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap;position:relative}
.snav b{font:500 27px var(--latin);letter-spacing:.3em;color:var(--ink);margin-inline-end:auto;direction:ltr}
.snav .set{display:flex;gap:30px}.snav .set.b{position:absolute;inset-inline-end:34px}
.shot{position:relative;height:492px;background:var(--sand);overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shotw{left:0;width:1080px;height:608px;transform-origin:50% 0;box-shadow:0 40px 80px -44px #2b1a12cc;overflow:hidden;background:#0C1420}
.shotw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.q{position:absolute;padding:12px 26px;border-radius:99px;background:#fff;border:2px dashed var(--copper);font:500 30px var(--body);color:var(--cd);box-shadow:0 16px 34px -16px #000c;white-space:nowrap}
.q.s{background:var(--cd);border:2px solid var(--cd);color:#fff}
.plab{text-align:center;font:500 54px var(--display);margin-bottom:22px}
.phone{border-radius:34px;overflow:hidden;box-shadow:0 40px 80px -40px #2b1a12cc,0 0 0 3px var(--line);height:974px}.phone img{width:100%;display:block}
.t{position:relative;height:412px}
.t>div{position:absolute;inset:0;padding:34px 38px;display:flex;flex-direction:column;align-items:flex-start}
h4{font:500 43px/1.2 var(--display);color:var(--ink)}
.t p{font-size:29px;line-height:1.45;color:var(--muted)}
.go{display:inline-block;padding:15px 34px;background:var(--ink);color:var(--cream);font:500 27px var(--body)}
.A h4{font-size:50px;margin-bottom:18px}.A p{margin-bottom:26px}
.B .row{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:17px;padding:4px 14px 6px;margin-inline:-14px;border-radius:14px;outline:3px solid transparent}
.B h4{font-size:40px}.B p{font-size:30px}.B .go{font-size:26px;padding:12px 30px}
.tag{padding:3px 18px 4px;border-radius:99px;background:var(--cd);color:#fff;font:500 21px var(--body)}
.zone{border:4px dashed #C4765A99;background:#C4765A14;display:flex;align-items:center;justify-content:center;text-align:center;font:500 34px/1.3 var(--body);color:var(--cd)}
.cap{left:90px;right:90px;text-align:center;font:600 44px/1.3 var(--body);color:#fff;text-shadow:0 0 14px #000c,0 2px 4px #000}
.cap span{background:#2A201Acc;padding:6px 18px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.end h2{font:500 80px/1.14 var(--display);color:var(--ink);text-align:center}
.end h2 b{font-weight:500;color:var(--cd)}
.svc{display:flex;align-items:baseline;justify-content:space-between;padding:24px 6px;border-bottom:2px solid var(--line);font:500 46px var(--display);color:var(--ink)}
.svc span{font:400 30px var(--body);color:var(--muted)}.svc bdi{font:500 46px var(--display);color:var(--cd);margin-inline-start:10px}
.offer{background:var(--deep);color:var(--cream);border-radius:20px;padding:30px 36px;text-align:center;font:500 40px/1.3 var(--display)}
.offer small{display:block;margin-top:8px;font:400 29px/1.35 var(--body);color:#E9DCCB}
.url{text-align:center;font:500 38px var(--latin);letter-spacing:.08em;color:var(--ink);direction:ltr}
</style>
<div id="st"></div>
<script>
const P=new URLSearchParams(location.search),guide=P.get('guide')==='1';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const ramp=(t,s,d=.5)=>ease((t-s)/d);
const DUR={p1:5,p2:6,p3:7,p4:7,p5:4,p6:6};
const CAPS={ // guide only: what Hagit says while the plate plays
 p1:[[0,5,'המוצר שלכם טוב. אז למה באתר הוא הולך לאיבוד?']],
 p2:[[0,2.2,'זה הירו שבניתי למותג קונספט של משקפיים.'],[2.2,6,'המשקפיים קטנים בפינה, כל הטקסט בצד אחד, ואמצע המסך ריק.']],
 p3:[[0,3,'וזה אותו הירו, אחרי. אותה הבטחה, אותם צבעים.'],[3,7,'רק שילבתי את המוצר במרכז, בגדול, ואת המילים משני הצדדים.']],
 p4:[[0,7,'וההמשך מדבר באותה שפה, סקשן אחרי סקשן.']],
 p5:[[0,4,'וגם בטלפון: קודם רואים את המוצר.']],
 p6:[[0,3,'עמוד נחיתה, אתר תדמית או שדרוג.'],[3,6,'ועד 12.12, גם התוכן שיביא אליו אנשים.']]};
const B='../regard-before/before-',A='../regard-after/after-';
const chip=(txt,css,o,solid)=>`<span class="q${solid?' s':''}" style="${css};opacity:${o};transform:scale(${.8+.2*o})">${txt}</span>`;
function shot(top,scale,m,chips,m2=0){
  return `<div class="abs shotw" style="top:${top}px;transform:scale(${scale})"><img src="${B}desktop.jpg"><img src="${A}desktop.jpg" style="opacity:${m}"><img src="${A}desktop-05.jpg" style="opacity:${m2}">${chips||''}</div>`}
const label=(top,a,b,m)=>`<div class="abs label" style="top:${top}px;opacity:${1-m}">${a[0]}<small>${a[1]}</small></div><div class="abs label" style="top:${top}px;opacity:${m};color:var(--cd)">${b[0]}<small>${b[1]}</small></div>`;
const L3=['וההמשך','כל סקשן מדבר באותה שפה.'];
const L1=['לפני','המוצר קיים. הוא פשוט לא נוכח.'],L2=['אחרי','אותה הבטחה, אותם צבעים. רק המקום השתנה.'];
const circle=`<div class="abs zone" style="left:330px;top:1130px;width:420px;height:420px;border-radius:50%">חגית<br>בעיגול</div>`;
function scene(s,t){let h='';
 if(s==='p1'){ h+=`<div class="abs hook">המוצר שלכם טוב.<br><b>אז למה באתר הוא הולך לאיבוד?</b></div>`+shot(520,.86,0);
   if(guide)h+=`<div class="abs zone" style="left:0;top:1090px;width:1080px;height:830px">חגית מדברת למצלמה<br>(חצי מסך תחתון)</div>`}
 if(s==='p2'){ h+=label(196,L1,L2,0)+shot(400,1,0,chip('המוצר קטן, בפינה','left:3%;top:68%',ramp(t,2.2,.4))+chip('כל הטקסט בצד אחד','right:4%;top:8%',ramp(t,3.4,.4))+chip('אמצע המסך ריק','left:33%;top:42%',ramp(t,4.6,.4))); if(guide)h+=circle}
 if(s==='p3'){ const m=ramp(t,.6,.8);
   h+=label(196,L1,L2,m)+shot(400,1,m,chip('המוצר במרכז, בגדול','left:31%;bottom:5%',ramp(t,3,.4),1)+chip('ההבטחה','right:6%;top:40%',ramp(t,4.4,.4),1)+chip('הדמות','left:6%;top:37%',ramp(t,4.4,.4),1),ramp(t,5.4,.7)); if(guide)h+=circle}
 if(s==='p4'){ h+=label(196,L3,L3,0)+`<div class="abs shotw" style="top:400px"></div>`; if(guide)h+=circle}
 if(s==='p5'){ const ph=(x,src,l,c,o)=>`<div class="abs" style="left:${x}px;top:300px;width:450px;opacity:${o}"><div class="plab" style="color:${c}">${l}</div><div class="phone"><img src="${src}"></div></div>`;
   h+=ph(60,B+'mobile.jpg','לפני','var(--ink)',1)+ph(570,A+'mobile.jpg','אחרי','var(--cd)',ramp(t,.9,.6)); if(guide)h+=`<div class="abs zone" style="left:390px;top:1450px;width:300px;height:300px;border-radius:50%">חגית<br>בעיגול</div>`}
 if(s==='p6'){ const a=i=>`opacity:${ramp(t,.2+i*.35,.5)};transform:translateY(${(1-ramp(t,.2+i*.35,.5))*24}px)`;
   h+=`<div class="abs end" style="top:230px;left:70px;right:70px"><h2 style="${a(0)}">אתרים שנראים אחרת.<br><b>ועובדים בשביל העסק.</b></h2>
   <div style="margin-top:56px">${[['עמוד נחיתה','3,200'],['אתר תדמית','6,500'],['שדרוג אתר קיים','1,900']].map((r,i)=>`<div class="svc" style="${a(i+1)}">${r[0]}<span>החל מ-<bdi>₪${r[1]}</bdi></span></div>`).join('')}</div>
   <div class="offer" style="margin-top:50px;${a(4)}">עד 12.12: ערכת תוכן להשקה<small>2 סרטונים, 2 קרוסלות ומאמר. בלי תוספת מחיר.</small></div>
   <div class="url" style="margin-top:44px;${a(5)}">hagitantebi.co.il/sites</div></div>`;
   if(guide)h+=`<div class="abs zone" style="left:320px;top:1280px;width:440px;height:440px;border-radius:50%">חגית<br>בעיגול</div>`}
 if(guide){const c=CAPS[s].find(c=>t>=c[0]&&t<c[1]);if(c)h+=`<div class="abs cap" style="top:${s==='p1'?1560:s==='p6'?1150:s==='p5'?1366:1010}px"><span>${c[2]}</span></div>`}
 document.getElementById('st').innerHTML=h}
window.draw=scene;window.DUR=DUR;scene(P.get('s')||'p1',+(P.get('t')||0));
</script>
