<!doctype html>
<!--
  Personal reel 01 · "לא פתחתי תוכנת עריכה" — motion overlay over Hagit's talking head (9:16, 1080×1920, 22s).
  The page is transparent: render.js screenshots it frame by frame and lays it over the footage with ffmpeg.
  Everything is a function of t (seconds): window.seek(t) draws one frame. No CSS animations, no clocks.
  Retiming to the real take: edit only the BEATS block below (seconds from the start of the take).
  Preview in a browser: open overlay.html?play — loops over the placeholder still.
  Safe zones (TikTok / Reels UI): keep text out of the bottom 380px and the right 140px below y=1000.
-->
<html lang="he">
<head>
<meta charset="utf-8">
<title>Reel 01 · AI edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&amp;family=Amatic+SC:wght@700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;display=swap">
<style>
:root{
  /* studio palette — same as the world reels */
  --cream:#FAF8F3; --paper:#FFFDF7; --ink:#3E2F25; --copper:#C4765A; --gold:#B8894A; --dark:#2A211B;
  --hl:#F5D76E;
}
html,body{margin:0;background:transparent}
body{font-family:'Heebo',sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage.preview{background:#000 url(../../../../hagit-portrait-2026.png) center/cover}
.abs{position:absolute}
.hidden{display:none}

/* 01 · effect index: the "in this video" panel at frame 0, then a chip */
#panel{right:28px;top:250px;width:318px;box-sizing:border-box;padding:20px 18px 16px;border-radius:26px;
  background:rgba(42,33,27,.88);border:1.5px solid rgba(184,137,74,.55);color:#F4EBDD;font-family:'JetBrains Mono',monospace;
  transform-origin:100% 0;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#panel .hd{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.14em;color:var(--gold);margin-bottom:10px}
#panel .it{display:flex;gap:14px;align-items:baseline;padding:5px 10px;border-radius:9px;font-size:21px;font-family:'Heebo',sans-serif;font-weight:500;direction:ltr}
#panel .it i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:14px;color:rgba(244,235,221,.55)}
#panel .it.on{background:var(--cream);color:var(--dark)}
#panel .it.on i{color:var(--copper)}
#panel .ft{margin-top:10px;padding-top:10px;border-top:1px solid rgba(244,235,221,.2);font-size:17px;font-family:'Heebo',sans-serif;font-weight:700;direction:ltr}
#chip{left:44px;top:250px;display:flex;align-items:center;gap:14px;padding:12px 22px 12px 16px;border-radius:999px;
  background:rgba(42,33,27,.86);border:1.5px solid rgba(184,137,74,.55);color:#F4EBDD;font-family:'JetBrains Mono',monospace;font-size:21px;direction:ltr}
#chip b{color:var(--gold);font-weight:700}
#chip .dot{width:12px;height:12px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 5px rgba(229,83,61,.25)}

/* hook: frame 0 already holds the whole line; at 1.7s the words fall out (gravity drop) */
#hook{left:60px;right:60px;top:1040px;direction:rtl;text-align:center}
#hook .ln{display:flex;justify-content:center;gap:26px;flex-wrap:nowrap}
.hw{display:inline-block;font-weight:900;font-size:118px;line-height:1.08;color:#fff;
  text-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 40px rgba(0,0,0,.45)}
.hw.pill{padding:0 30px;border-radius:28px;background:var(--copper);text-shadow:none;font-family:'Heebo',sans-serif;direction:ltr}

/* spoken captions, word by word, one keyword on a pill */
#cap{left:70px;right:70px;top:1180px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;direction:rtl}
.cw{display:inline-block;font-weight:800;font-size:78px;line-height:1.22;color:#fff;padding:0 10px;border-radius:16px;
  text-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 30px rgba(0,0,0,.5)}
.cw.key{background:var(--copper);text-shadow:none}

/* giant caption moment */
#giant{left:0;right:0;top:980px;text-align:center;direction:rtl}
#giant div{font-weight:900;font-size:212px;line-height:.98;color:#fff;letter-spacing:-.02em;
  text-shadow:0 8px 0 rgba(0,0,0,.2),0 14px 50px rgba(0,0,0,.5)}
#giant div:last-child{color:var(--hl)}

/* icon strike: a generic editing app icon, struck out */
#icon{left:50%;top:330px;width:250px;height:250px;margin-left:-125px}
#icon .tile{position:absolute;inset:0;border-radius:58px;background:linear-gradient(160deg,#4B4D5C,#1F2029);box-shadow:0 26px 60px rgba(0,0,0,.45)}
#icon .lbl{position:absolute;left:-60px;right:-60px;top:272px;text-align:center;font-weight:700;font-size:32px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6)}

/* prompt bar */
#prompt{left:60px;right:60px;top:300px;box-sizing:border-box;padding:26px 30px;border-radius:34px;background:rgba(255,253,247,.96);
  box-shadow:0 30px 80px rgba(0,0,0,.35);direction:rtl}
#prompt .row{display:flex;align-items:center;gap:20px}
#prompt .txt{flex:1;font-size:50px;font-weight:500;color:var(--dark);white-space:nowrap;overflow:hidden;min-height:66px}
#prompt .caret{display:inline-block;width:4px;height:52px;margin-right:4px;vertical-align:-8px;background:var(--copper)}
#prompt .send{width:76px;height:76px;border-radius:50%;background:var(--copper);display:flex;align-items:center;justify-content:center;flex:none}
#prompt .meta{display:flex;justify-content:space-between;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.12em;color:#9A8B7C;direction:ltr}

/* reel feed: world films floating round the head */
.card{width:216px;height:384px;border-radius:22px;overflow:hidden;background:#111;border:5px solid #fff;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card span{position:absolute;left:0;right:0;bottom:0;padding:30px 0 12px;text-align:center;color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;
  background:linear-gradient(transparent,rgba(0,0,0,.6))}

/* big idea notebook */
#note{left:180px;top:930px;width:720px;height:560px;box-sizing:border-box;padding:46px 56px 40px 40px;border-radius:26px;direction:rtl;
  background:var(--paper) repeating-linear-gradient(transparent 0 79px,#D6E1EE 79px 81px);background-position:0 30px;
  box-shadow:0 34px 80px rgba(0,0,0,.4)}
#note:before{content:'';position:absolute;top:0;bottom:0;right:62px;width:3px;background:#EBA3A3}
#note .date{position:absolute;left:40px;top:26px;font-family:'Amatic SC',cursive;font-size:38px;color:#7A6E62;direction:ltr}
#note .l{position:relative;font-family:'Amatic SC',cursive;font-weight:700;font-size:96px;line-height:80px;color:var(--dark);margin-right:40px}
#note .l + .l{margin-top:0}
#note mark{position:relative;background:none;color:inherit}
#note mark i{position:absolute;right:-8px;left:-8px;bottom:6px;height:38px;background:var(--hl);z-index:-1;transform-origin:100% 50%;border-radius:6px}
#note .badge{position:absolute;left:-22px;top:-22px;width:78px;height:78px;border-radius:50%;background:#E5533D;color:#fff;
  font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.3)}

/* comment CTA + comment drop */
#cta{left:70px;right:70px;top:1120px;box-sizing:border-box;padding:28px 30px;border-radius:30px;background:rgba(255,253,247,.97);
  box-shadow:0 30px 80px rgba(0,0,0,.4);direction:rtl;display:flex;gap:22px;align-items:flex-start}
#cta .av,.drop .av{width:84px;height:84px;border-radius:50%;flex:none;background:url(../../../../hagit-portrait-2026.png) 50% 18%/cover;border:3px solid var(--copper)}
#cta .nm{font-size:28px;font-weight:700;color:#8A7A6A;direction:ltr;text-align:right}
#cta .tx{font-size:50px;font-weight:700;color:var(--dark);line-height:1.2;margin-top:4px}
#cta .tx em{font-style:normal;padding:0 14px;border-radius:12px;background:var(--copper);color:#fff}
.drop{left:150px;right:110px;box-sizing:border-box;padding:20px 26px;border-radius:26px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.35);
  direction:rtl;display:flex;gap:18px;align-items:center}
.drop .av{width:64px;height:64px;border:0}
.drop .tx{flex:1;font-size:46px;font-weight:800;color:var(--dark)}
.drop .ht{font-size:40px;color:#E5533D}

.ph{left:44px;bottom:420px;padding:10px 18px;border-radius:12px;background:rgba(229,83,61,.92);color:#fff;font-family:'JetBrains Mono',monospace;font-size:20px;direction:ltr}
</style>
</head>
<body>
<div id="stage">
  <div id="panel" class="abs"></div>
  <div id="chip" class="abs"><span class="dot"></span><b id="chipN"></b><span id="chipT"></span></div>
  <div id="hook" class="abs"></div>
  <div id="icon" class="abs">
    <div class="tile"></div>
    <svg class="abs" style="inset:0" viewBox="0 0 250 250" aria-hidden="true">
      <rect x="52" y="78" width="146" height="94" rx="14" fill="none" stroke="#fff" stroke-width="9"/>
      <path d="M108 104 L148 125 L108 146 Z" fill="#fff"/>
      <path d="M52 196 H198" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".55"/>
      <path d="M90 186 V206" stroke="#E5533D" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <svg class="abs" style="left:-40px;top:-40px;width:330px;height:330px;overflow:visible" viewBox="0 0 330 330" aria-hidden="true">
      <path id="strike" d="M40 290 L290 40" stroke="#E5533D" stroke-width="26" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
    <div class="lbl">תוכנת עריכה</div>
  </div>
  <div id="prompt" class="abs">
    <div class="meta"><span>ASK · AI EDIT</span><span id="pState">TYPING</span></div>
    <div class="row"><div class="txt"><span id="pTxt"></span><span class="caret" id="pCaret"></span></div>
      <div class="send" id="pSend"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </div>
  <div id="cap" class="abs"></div>
  <div id="giant" class="abs"><div>כתוביות</div><div>ענקיות.</div></div>
  <div id="feed"></div>
  <div id="note" class="abs">
    <div class="badge">!</div>
    <div class="date">Oct · big idea</div>
    <div class="l" id="n1">הכלי לא משנה.</div>
    <div class="l" id="n2"><mark>השפה<i id="nHl"></i></mark> שאת נותנת לו</div>
    <div class="l" id="n3">— משנה.</div>
    <svg class="abs" style="left:46px;bottom:34px;width:150px;height:120px" viewBox="0 0 150 120" aria-hidden="true">
      <path id="nArrow" d="M10 100 C 40 30, 90 20, 132 40 M132 40 L112 26 M132 40 L116 60" stroke="#C4765A" stroke-width="7" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    </svg>
  </div>
  <div id="cta" class="abs"><div class="av"></div><div><div class="nm">@hagit.antebi</div><div class="tx">כתבי <em>עולם</em> בתגובות<br>ואשלח לך איך ✨</div></div></div>
  <div id="drops"></div>
  <div class="ph abs hidden" id="ph">PLACEHOLDER · your take goes here</div>
</div>

<script>
/* ── BEATS: the only block to retime. Seconds from the start of the take. ───────────────── */
const DUR = 22;
const EFFECTS = ['Kinetic hook', 'Icon strike', 'Prompt bar', 'Giant captions', 'Reel feed', 'Big idea', 'Comment CTA'];
const BEATS = {
  hook:   [0, 2.3],          // frame 0 = thumbnail: the whole hook + the effect panel
  icon:   [2.3, 4.5],
  prompt: [4.3, 8.9],        // typing runs 5.9 → 8.2, "send" at 8.4
  giant:  [8.6, 10.3],
  feed:   [10.2, 15.3],
  note:   [15.3, 18.8],
  cta:    [18.7, 22],
};
const HOOK = [['את', 'כל', 'העריכה', 'פה'], ['עשה', '*AI']];          // * = pill word
const PROMPT_TEXT = 'תוסיפי כתוביות ענקיות';
const PROMPT_TYPE = [5.9, 8.2];
const CAPS = [  // [start, end, words] — * marks the keyword pill. Must match what Hagit says.
  [2.4, 4.4, 'לא פתחתי *שום תוכנת עריכה.'],
  [4.4, 5.9, 'פשוט *כתבתי לו מה אני רוצה:'],
  [10.3, 12.7, 'וככה אני בונה *עולמות מותג.'],
  [12.7, 15.3, 'אבל הסוד הוא *לא הכלי.'],
];
const FILMS = [  // slug, label, x, y, tilt — kept off the face (centre 260–820 × 380–1000)
  ['oreva', 'ORÉVA°', 34, 420, -6], ['crema', 'Crema°', 830, 360, 5], ['signe', 'SIGNÉ°', 22, 880, 4],
  ['rosee', 'ROSÉE°', 842, 840, -4], ['encore', 'ENCORE°', 432, 1330, 3]];
const FILM_FRAMES = 60, FILM_FPS = 15;
const DROPS = [  // viewers answering the CTA
  [20.0, 'עולם', 1430], [20.6, 'עולם 🙌', 1560]];

/* ── helpers ─────────────────────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const bounce = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
// in/out envelope for a window [a,b]: 0 → 1 over `fi`, 1 → 0 over `fo`
const env = (t, a, b, fi = .25, fo = .25) => t < a || t > b ? 0 : Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const words = s => s.split(' ').map(w => w.startsWith('*') ? [w.slice(1), true] : [w, false]);

/* ── build ───────────────────────────────────────────────────────────────────────────────── */
$('panel').innerHTML = `<div class="hd"><span>IN THIS VIDEO</span><span>0${EFFECTS.length} FX</span></div>` +
  EFFECTS.map((e, i) => `<div class="it" id="pi${i}"><i>0${i + 1}</i>${e}</div>`).join('') +
  `<div class="ft">0 editing apps opened</div>`;
const hookEls = [];
$('hook').innerHTML = HOOK.map(line => `<div class="ln">${line.map(w => {
  const pill = w.startsWith('*'); return `<span class="hw${pill ? ' pill' : ''}">${pill ? w.slice(1) : w}</span>`; }).join('')}</div>`).join('');
$('hook').querySelectorAll('.hw').forEach(e => hookEls.push(e));
const feed = FILMS.map(([slug, label, x, y, r], i) => {
  const d = document.createElement('div');
  d.className = 'card abs'; d.style.left = x + 'px'; d.style.top = y + 'px';
  d.innerHTML = `<img alt="" src="_build/films/${slug}/01.jpg"><span>${label}</span>`;
  $('feed').appendChild(d);
  return { d, img: d.querySelector('img'), slug, r, i };
});
// preload every film frame so screenshots never catch a half-decoded image
const preload = [];
FILMS.forEach(([slug]) => { for (let k = 1; k <= FILM_FRAMES; k++) { const im = new Image(); im.src = `_build/films/${slug}/${String(k).padStart(2, '0')}.jpg`; preload.push(im); } });
const drops = DROPS.map(([t0, txt, y]) => {
  const d = document.createElement('div');
  d.className = 'drop abs'; d.style.top = y + 'px';
  d.innerHTML = `<div class="av" style="background:#${['D9C3A5', 'B7C9B0'][DROPS.findIndex(x => x[0] === t0)]}"></div><div class="tx">${txt}</div><div class="ht">♥</div>`;
  $('drops').appendChild(d);
  return { d, t0, ht: d.querySelector('.ht') };
});
let capKey = '';

/* ── draw one frame ──────────────────────────────────────────────────────────────────────── */
function seek(t) {
  // effect index → which effect is live
  const order = ['hook', 'icon', 'prompt', 'giant', 'feed', 'note', 'cta'];
  let cur = 0; order.forEach((k, i) => { if (t >= BEATS[k][0]) cur = i; });
  EFFECTS.forEach((_, i) => $('pi' + i).classList.toggle('on', i === cur));
  const pOut = prog(t, 1.9, 2.4);
  show($('panel'), pOut < 1);
  $('panel').style.opacity = 1 - pOut;
  $('panel').style.transform = `scale(${1 - .35 * easeIn(pOut)})`;
  const chipIn = env(t, 2.3, DUR, .3, .01);
  show($('chip'), chipIn > 0);
  $('chip').style.opacity = chipIn;
  $('chip').style.transform = `translateY(${(1 - easeOut(chipIn)) * -20}px)`;
  $('chipN').textContent = `0${cur + 1}/0${EFFECTS.length}`;
  $('chipT').textContent = EFFECTS[cur];

  // hook: in place at frame 0, a tiny breath, then each word falls with gravity and a spin
  show($('hook'), t < BEATS.hook[1] + .4);
  hookEls.forEach((e, i) => {
    const breath = 1 + .04 * Math.sin(Math.min(t, 1.7) * 5 + i);
    const f = easeIn(prog(t, 1.7 + i * .07, 2.35 + i * .07));
    const dir = i % 2 ? 1 : -1;
    e.style.transform = `translateY(${f * 1100}px) rotate(${dir * f * 38}deg) scale(${t < 1.7 ? breath : 1})`;
    e.style.opacity = 1 - prog(t, 2.2 + i * .07, 2.5 + i * .07);
  });

  // icon strike
  const ic = env(t, BEATS.icon[0], BEATS.icon[1], .35, .3);
  show($('icon'), ic > 0);
  $('icon').style.opacity = ic;
  const shake = t > 3.25 && t < 3.6 ? Math.sin(t * 90) * 10 * (1 - prog(t, 3.25, 3.6)) : 0;
  $('icon').style.transform = `scale(${t < BEATS.icon[0] + .35 ? back(prog(t, BEATS.icon[0], BEATS.icon[0] + .35)) : 1 - .25 * prog(t, BEATS.icon[1] - .3, BEATS.icon[1])}) translateX(${shake}px)`;
  $('strike').setAttribute('stroke-dashoffset', 1 - easeOut(prog(t, 3.0, 3.3)));

  // prompt bar: drops in, types, sends, then flies up
  const [pa, pb] = BEATS.prompt;
  const pin = prog(t, pa, pa + .4), pout = prog(t, pb - .35, pb);
  show($('prompt'), t >= pa && t <= pb);
  $('prompt').style.opacity = Math.min(pin * 2, 1 - pout);
  $('prompt').style.transform = `translateY(${(1 - back(pin)) * -140 - easeIn(pout) * 220}px)`;
  const n = Math.round(PROMPT_TEXT.length * prog(t, ...PROMPT_TYPE));
  $('pTxt').textContent = PROMPT_TEXT.slice(0, n);
  $('pCaret').style.opacity = t < PROMPT_TYPE[1] + .1 ? (Math.floor(t * 3) % 2 || (t > PROMPT_TYPE[0] && t < PROMPT_TYPE[1]) ? 1 : 0) : 0;
  $('pState').textContent = t < PROMPT_TYPE[0] ? 'READY' : t < 8.4 ? 'TYPING' : 'SENT ✓';
  const press = t > 8.3 && t < 8.6 ? 1 - .18 * Math.sin(prog(t, 8.3, 8.6) * Math.PI) : 1;
  $('pSend').style.transform = `scale(${press})`;

  // spoken captions: words pop in across the first 70% of their window
  const c = CAPS.find(([a, b]) => t >= a && t < b);
  const key = c ? c[2] : '';
  if (key !== capKey) {
    $('cap').innerHTML = c ? words(c[2]).map(([w, k]) => `<span class="cw${k ? ' key' : ''}">${w}</span>`).join('') : '';
    capKey = key;
  }
  if (c) {
    const els = $('cap').children, [a, b] = c;
    [...els].forEach((e, i) => {
      const s = a + (b - a) * .7 * i / els.length;
      const p = prog(t, s, s + .18);
      e.style.opacity = p * (1 - prog(t, b - .12, b));
      e.style.transform = `translateY(${(1 - easeOut(p)) * 26}px) scale(${.85 + .15 * back(p)})`;
    });
  }

  // giant captions: slam in, slight drift
  const [ga, gb] = BEATS.giant;
  const gIn = prog(t, ga, ga + .22);
  show($('giant'), t >= ga && t <= gb);
  $('giant').style.opacity = Math.min(gIn * 3, 1 - prog(t, gb - .2, gb));
  $('giant').style.transform = `scale(${1.6 - .6 * easeOut(gIn) + .03 * prog(t, ga, gb)})`;

  // reel feed: cards pop in one by one, bob, play their film, fly out
  const [fa, fb] = BEATS.feed;
  feed.forEach(({ d, img, slug, r, i }) => {
    const a = fa + i * .18, p = prog(t, a, a + .45), o = prog(t, fb - .4 + i * .03, fb);
    show(d, t >= a && t <= fb);
    const bob = Math.sin((t - a) * 2.2 + i * 1.3) * 10;
    d.style.opacity = Math.min(p * 2, 1 - o);
    d.style.transform = `translateY(${bob - easeIn(o) * 160}px) rotate(${r + (1 - p) * 14}deg) scale(${back(p) * (1 - .3 * o)})`;
    if (t >= a && t <= fb) img.src = `_build/films/${slug}/${String(Math.floor((t - a) * FILM_FPS) % FILM_FRAMES + 1).padStart(2, '0')}.jpg`;
  });

  // big idea notebook: rises, lines appear, highlighter sweeps, arrow draws
  const [na, nb] = BEATS.note;
  const nin = prog(t, na, na + .45), nout = prog(t, nb - .3, nb);
  show($('note'), t >= na && t <= nb);
  $('note').style.opacity = Math.min(nin * 2, 1 - nout);
  $('note').style.transform = `translateY(${(1 - easeOut(nin)) * 300 + easeIn(nout) * 80}px) rotate(${-3 + 3 * easeOut(nin)}deg)`;
  ['n1', 'n2', 'n3'].forEach((id, i) => { const p = prog(t, na + .45 + i * .55, na + .75 + i * .55); $(id).style.opacity = p; $(id).style.transform = `translateX(${(1 - easeOut(p)) * -30}px)`; });
  $('nHl').style.transform = `scaleX(${easeOut(prog(t, na + 1.8, na + 2.2))})`;
  $('nArrow').setAttribute('stroke-dashoffset', 1 - easeOut(prog(t, na + 2.1, na + 2.6)));
  document.querySelector('#note .badge').style.transform = `scale(${back(prog(t, na + .3, na + .6))})`;

  // comment CTA, then viewers' comments drop in
  const [ca] = BEATS.cta;
  const cin = prog(t, ca, ca + .45);
  show($('cta'), t >= ca);
  $('cta').style.opacity = Math.min(cin * 2, 1);
  $('cta').style.transform = `translateY(${(1 - back(cin)) * 260}px)`;
  drops.forEach(({ d, t0, ht }) => {
    const p = prog(t, t0, t0 + .5);
    show(d, t >= t0);
    d.style.opacity = Math.min(p * 3, 1);
    d.style.transform = `translateY(${(1 - bounce(p)) * -260}px)`;
    ht.style.transform = `scale(${t > t0 + .6 ? back(prog(t, t0 + .6, t0 + .9)) : 0})`;
  });
}
window.seek = seek;
window.DUR = DUR;
// fonts used only later in the reel are not fetched at frame 0 — ask for them up front
const FONTS = ['900 100px Heebo', '800 100px Heebo', '700 100px Heebo', '500 100px Heebo', '700 100px "Amatic SC"',
  '500 20px "JetBrains Mono"', 'italic 500 30px "Cormorant Garamond"'];
window.ready = Promise.all([document.fonts.ready, ...FONTS.map(f => document.fonts.load(f, 'אבג abc').catch(() => {})),...preload.map(i => i.decode().catch(() => {}))]);

if (location.search.includes('play')) {   // browser preview over the portrait
  $('stage').classList.add('preview'); $('ph').classList.remove('hidden');
  const t0 = performance.now();
  const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
} else seek(0);
</script>
