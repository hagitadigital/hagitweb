<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"Assistant",sans-serif;background:#f6e2da;position:relative}
  .photo{position:absolute;inset:0;background:url("../petale/film/boite-ouverte.webp") 40px 46%/1560px auto no-repeat}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(253,246,240,.97) 0%,rgba(253,246,240,.9) 30%,rgba(253,246,240,.45) 46%,rgba(253,246,240,0) 60%)}
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(232,74,138,.42);border-radius:12px}
  .cover{position:relative;width:100%;height:100%;display:flex;align-items:center;z-index:2}
  .text{width:520px;padding:0 0 0 72px;margin-left:0;margin-right:auto;text-align:right}
  .kicker{font-size:17px;letter-spacing:5px;text-transform:uppercase;font-weight:700;color:#e84a8a;direction:ltr;text-align:right}
  .brand{font-family:"Fraunces",serif;font-weight:500;font-size:138px;line-height:.92;color:#3a2438;margin-top:14px;letter-spacing:-2px;direction:ltr;text-align:right}
  .brand i{font-style:italic;font-weight:300;color:#ff7aa2}
  .tag{font-size:30px;font-weight:600;color:#3a2438;margin-top:22px;line-height:1.25}
  .rule{width:64px;height:2px;background:#e84a8a;margin:22px 0 16px}
  .sub{font-size:17px;color:#8a7080;letter-spacing:.5px}
  .chip{position:absolute;right:36px;bottom:36px;z-index:3;font-size:14px;font-weight:600;color:#3a2438;background:rgba(255,255,255,.72);
    padding:8px 14px;border-radius:20px;direction:ltr;font-family:"Fraunces",serif;font-style:italic}
</style>
</head>
<body>
<div class="photo"></div>
<div class="veil"></div>
<div class="frame"></div>
<div class="cover">
  <div class="text">
    <div class="kicker">Maison de Macarons · Paris</div>
    <div class="brand">Pétale<i>°</i></div>
    <div class="tag">עולם מותג מקרונים — בסרט</div>
    <div class="rule"></div>
    <div class="sub">שבעה טעמים · קופסה אחת · שתי ידיים · Brand Worlds Studio</div>
  </div>
</div>
<div class="chip">Le Film · III chapitres</div>
</body>
</html>
